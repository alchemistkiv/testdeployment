name: Deploy to GitHub Pages

# Bu branch'e her push'ta otomatik çalışır
on:
  push:
    branches:
      - claude/deployment-options-research-1HWAB
  workflow_dispatch: # Actions sekmesinden elle de tetikleyebilirsin

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Pages yapılandır
        uses: actions/configure-pages@v5

      - name: Dosyaları paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: "." # Statik dosyalar repo kökünde

      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
